services:
  - type: web
    name: restanage
    runtime: node
    plan: starter
    buildCommand: npm ci && npm --prefix backend ci && npm run build
    startCommand: npm --prefix backend run seed:admin && npm --prefix backend start
    healthCheckPath: /api/health
    disk:
      name: restanage-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: SERVE_FRONTEND
        value: "true"
      - key: VITE_API_BASE_URL
        value: ""
      - key: DATABASE_FILE
        value: /var/data/restanage.sqlite
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_NAME
        value: RESTANAGE Admin
      - key: ADMIN_PASSWORD
        sync: false
